<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project · Mounir Meziane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="site.css">
  <style>
    .back {
      display: inline-flex;
      gap: 8px;
      text-decoration: none;
      font-weight: 600;
      color: var(--gray);
      margin-bottom: 22px;
      transition: color .2s, transform .3s var(--ease);
    }

    .back:hover {
      color: var(--purple);
      transform: translateX(-4px);
    }

    .p-title {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(36px, 7vw, 68px);
      line-height: .95;
      margin: 0 0 10px;
      letter-spacing: -.02em;
    }

    .p-desc {
      font-size: 19px;
      color: var(--gray);
      margin: 0 0 18px;
      max-width: 60ch;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .tags span {
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--tint);
      color: var(--purple);
    }

    .player {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(135deg, #EDE9FE, #DBEAFE);
      border: 1px solid var(--line);
      aspect-ratio: 16 / 9;
      max-width: 100%;
      box-shadow: 0 24px 60px rgba(26, 26, 46, .10);
    }

    .player video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #111;
    }

    .player .ph {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: #7B7698;
      font-family: var(--mono);
      font-size: 13px;
    }

    .player .ph svg {
      width: 64px;
      height: 64px;
      margin: 0 auto 10px;
      display: block;
      color: var(--purple);
    }

    .cols {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      margin-top: 30px;
    }

    .card {
      padding: 26px;
      border-radius: 22px;
      background: rgba(255, 255, 255, .8);
      border: 1px solid var(--line);
      transition: transform .4s var(--ease), border-color .3s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--violet);
    }

    .card .k {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--purple);
    }

    .card h2 {
      font-family: var(--display);
      margin: 6px 0 10px;
      font-size: 26px;
    }

    .card p {
      margin: 0;
      color: var(--gray);
      white-space: pre-line;
    }

    .actions {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .missing {
      text-align: center;
      padding: 80px 0;
    }

    .missing h1 {
      font-family: var(--display);
      font-size: 40px;
      margin: 0 0 10px;
    }

    .missing p {
      color: var(--gray);
      margin: 0 0 24px;
    }
  </style>
</head>

<body data-page="project">

  <main id="view"></main>

  <script src="projects.js"></script>
  <script src="site.js"></script>
  <script>
    function render() {
      const view = document.getElementById("view");
      const p = (window.PROJECTS || []).find(x => x.id === location.hash.slice(1));
      if (!p) {
        view.innerHTML = `<div class="missing"><h1>Project not found</h1><p>This project doesn't exist yet. Pick one from the projects page.</p><a class="btn solid" href="index.html">See all projects</a></div>`;
        return;
      }
      document.title = p.title + " · Mounir Meziane";
      view.innerHTML = `
      <a class="back" href="index.html">← All projects</a>
      <h1 class="p-title">${esc(p.title)}</h1>
      <p class="p-desc">${esc(p.description)}</p>
      ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
      <div class="player">
        ${p.video
          ? `<video src="${esc(p.video)}" poster="${esc(p.image || "")}" controls playsinline preload="metadata"></video>`
          : `<div class="ph"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z" fill="currentColor"/></svg>Demo video coming soon</div></div>`}
      </div>
      <div class="cols">
        <section class="card"><span class="k">How it works</span><h2>Under the hood</h2><p>${esc(p.how || "Coming soon.")}</p></section>
        <section class="card"><span class="k">Inspiration</span><h2>Why I built it</h2><p>${esc(p.why || "Coming soon.")}</p></section>
      </div>
      <div class="actions">
        ${p.live ? `<a class="btn solid" href="${esc(p.live)}">Try it live</a>` : ""}
        ${p.code ? `<a class="btn" href="${esc(p.code)}" target="_blank" rel="noopener">View the code</a>` : ""}
      </div>`; window.scrollTo(0, 0);
    }
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>

</html>
